<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, JS, TTS & p5.js Console Collector</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            padding: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        iframe {
            display: none;
        }

        button {
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <textarea id="consoleOutput" readonly>[LOG] - Console capture initialized successfully
</textarea>

    <textarea id="htmlInput" placeholder="Paste your HTML/JS code here..." style="height:150px;"></textarea>
    <br>
    <button id="runBtn">Run</button>

    <iframe id="preview"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/parse5@7.1.1/dist/parse5.min.js"></script>

    <script>
        class ConsoleCollector {
            constructor(htmlInputId, consoleOutputId, iframeId) {
                this.htmlInput = document.getElementById(htmlInputId);
                this.consoleOutput = document.getElementById(consoleOutputId);
                this.iframe = document.getElementById(iframeId);
                this.init();
            }

            timestamp() {
                const now = new Date();
                return now.toTimeString().split(' ')[0]; // HH:MM:SS
            }

            formatMessage(type, message) {
                let msg;
                try {
                    if (typeof message === 'object') msg = JSON.stringify(message);
                    else msg = message;
                } catch (e) {
                    msg = String(message);
                }
                return `[${type}] ${this.timestamp()} - ${msg}`;
            }

            appendMessage(type, ...args) {
                args.forEach(arg => {
                    this.consoleOutput.value += this.formatMessage(type, arg) + '\n';
                });
                this.consoleOutput.scrollTop = this.consoleOutput.scrollHeight;
            }

            checkHTMLStructure(html) {
                try {
                    const documentFragment = parse5.parseFragment(html, {
                        sourceCodeLocationInfo: true
                    });
                    this.traverseNode(documentFragment);
                } catch (e) {
                    this.appendMessage('ERROR', 'HTML Parsing Error: ' + e.message);
                }
            }

            traverseNode(node) {
                if (!node) return;
                const seenIds = {};
                if (node.attrs) {
                    node.attrs.forEach(attr => {
                        if (attr.name.toLowerCase() === 'id') {
                            if (seenIds[attr.value]) this.appendMessage('ERROR', `Duplicate ID detected: ${attr.value}`);
                            else seenIds[attr.value] = true;
                        }
                    });
                }
                if (node.childNodes) node.childNodes.forEach(child => this.traverseNode(child));
            }

            captureConsole(iframeWindow) {
                // Override console methods
                ['log', 'info', 'warn', 'error'].forEach(type => {
                    const original = iframeWindow.console[type];
                    iframeWindow.console[type] = (...args) => {
                        this.appendMessage(type.toUpperCase(), ...args);
                        original.apply(iframeWindow.console, args);
                    };
                });

                // Capture runtime JS errors
                iframeWindow.onerror = (message, source, lineno, colno, error) => {
                    this.appendMessage('ERROR', `Caught error: ${message} (${source}:${lineno}:${colno})`);
                };

                iframeWindow.onunhandledrejection = event => {
                    this.appendMessage('ERROR', `Unhandled Promise Rejection: ${event.reason}`);
                };

                // Wrap TTS to catch silent errors
                const originalSpeak = iframeWindow.speechSynthesis?.speak;
                if (originalSpeak) {
                    iframeWindow.speechSynthesis.speak = (utterance) => {
                        try {
                            originalSpeak.call(iframeWindow.speechSynthesis, utterance);
                            this.appendMessage('LOG', `TTS spoken: ${utterance.text || '[no text]'}`);
                        } catch (e) {
                            this.appendMessage('ERROR', `TTS Error: ${e.message}`);
                        }
                    };
                }

                // Wrap p5.js create functions to catch runtime issues
                if (iframeWindow.p5) {
                    const p5Proto = iframeWindow.p5.prototype;
                    ['ellipse', 'rect', 'line', 'createCanvas', 'loadImage', 'loadSound'].forEach(fn => {
                        const original = p5Proto[fn];
                        if (!original) return;
                        p5Proto[fn] = function(...args) {
                            try {
                                return original.apply(this, args);
                            } catch (e) {
                                iframeWindow.console.error(`p5.js ${fn} error:`, e);
                            }
                        };
                    });
                }
            }

            run() {
                const htmlCode = this.htmlInput.value;
                this.consoleOutput.value = `[LOG] ${this.timestamp()} - Console capture initialized successfully\n`;

                // Check HTML structure
                this.checkHTMLStructure(htmlCode);

                // Render HTML/JS in iframe
                const iframeDoc = this.iframe.contentDocument || this.iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(htmlCode);
                iframeDoc.close();

                // Capture all console & runtime errors
                this.captureConsole(this.iframe.contentWindow);
            }

            init() {
                document.getElementById('runBtn').addEventListener('click', () => this.run());
            }
        }

        // Initialize the collector
        new ConsoleCollector('htmlInput', 'consoleOutput', 'preview');
    </script>
</body>

</html>
