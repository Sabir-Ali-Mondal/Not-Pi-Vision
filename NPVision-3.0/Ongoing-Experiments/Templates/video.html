<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultimate Showcase: AI Video Creator Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f172a; --bg-end: #312e81; --text-light: #e0e7ff;
            --accent-glow: #f472b6; --accent-bright: #38bdf8;
        }
        body { font-family: 'Manrope', system-ui, sans-serif; background-color: var(--bg-start); margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .container { max-width: 900px; width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .canvas-wrapper { position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border-radius: 0.75rem; overflow: hidden; }
        canvas { width: 100%; height: auto; background-color: var(--bg-start); aspect-ratio: 16 / 9; display: block; }
        h1 { color: #fff; font-weight: 800; text-shadow: 0 0 15px var(--accent-glow); }
        p { color: #c7d2fe; }
        #status { margin-top: 1.5rem; color: #a5b4fc; }
        button { font-family: 'Manrope', sans-serif; font-size: 1.1rem; padding: 0.8rem 1.8rem; background-image: linear-gradient(to right, var(--accent-glow), var(--accent-bright)); color: white; border: none; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s ease; font-weight: 700; margin-top: 1rem; box-shadow: 0 0 25px rgba(244, 114, 182, 0.5); }
        button:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 6px 30px rgba(244, 114, 182, 0.7); }
        button:disabled { background: #4b5563; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.5; }
        #loadingOverlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 10; transition: opacity 0.5s ease; }
        .loading-spinner { width: 4rem; height: 4rem; border: 0.3rem solid transparent; border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingText { margin-top: 1.5rem; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Ultimate AI Video Showcase</h1>
        <p>This demo renders a complete, animated video about this project, showcasing all advanced scene types.</p>
        <div class="canvas-wrapper">
            <canvas id="demoCanvas" width="1280" height="720"></canvas>
            <div id="loadingOverlay">
                <div class="loading-spinner"></div>
                <div id="loadingText">Preparing Showcase...</div>
            </div>
        </div>
        <p id="status">Please wait, preparing the experience...</p>
        <button id="startBtn" disabled>Loading...</button>
    </div>

<script>
const showcaseJson = {
  "width": 1280, "height": 720,
  "scenes": [
    { "id": "title", "type": "title", "text": "AI Video Creator Pro", "narration": "Welcome to the future of video creation. A world where your ideas are brought to life, instantly, through the power of code.", "voiceGender": "female" },
    { "id": "paragraph", "type": "paragraph", "text": "Beyond Complexity", "narration": "Traditional video editing is a maze of timelines and complex software. We believe creation should be as simple as writing down your thoughts. This tool makes that a reality.", "bgUrl": "https://images.unsplash.com/photo-1522204523234-8729aa6e3d54?w=1280&auto=format&fit=crop&q=80", "voiceGender": "male" },
    { "id": "html_content", "type": "html_content", "text": "Your Vision, as Code", "narration": "At its core is a simple yet powerful idea: describe your video with JSON. Define scenes, text, and data, and our engine transforms it into a dynamic, animated story.", "html": `<div class="card">✨<h2>JSON → Mōtion</h2><p>The universal language of data, now the language of video creation.</p></div>`, "css": `.card{width:600px; background:linear-gradient(145deg, #6d28d9, #be185d); border-radius:20px; color:white; font-family:Manrope, sans-serif; padding:40px; box-shadow:0 20px 40px rgba(0,0,0,0.3); text-align:center;} h2{font-size:40px; margin:0 0 15px 0;} p{font-size:20px; opacity:0.9;}`, "bgUrl": "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1280&auto=format&fit=crop&q=80", "voiceGender": "female" },
    { "id": "bullet_points", "type": "bullet_points", "text": "A Universe of Features", "narration": "This tool is packed with everything you need. Create stunning data visualizations, design custom layouts with HTML, or showcase complex diagrams with ease.", "points": [ "Animated Charts & Tables", "Podcast-Style Narration", "Custom HTML/CSS Scenes", "Static & BG Images" ], "bgUrl": "https://images.unsplash.com/photo-1518770660439-4636190af475?w=1280&auto=format&fit=crop&q=80", "voiceGender": "male" },
    { "id": "chart_scene", "type": "chart", "text": "Visualize Your Data", "narration": "Bring your data to life. Bar charts are perfect for comparing values and showing growth over time, all animated beautifully without any extra effort.", "chartData": [ { "label": "Q1", "value": 65 }, { "label": "Q2", "value": 78 }, { "label": "Q3", "value": 92 }, { "label": "Q4", "value": 85 } ], "bgUrl": "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1280&auto=format&fit=crop&q=80", "voiceGender": "female" },
    { "id": "pie_chart_scene", "type": "pie_chart", "text": "Understand Proportions", "narration": "Pie charts make it easy to understand proportions and market share. Our engine animates each slice for a dynamic and engaging presentation.", "pieData": [ { "label": "Marketing", "value": 40 }, { "label": "Sales", "value": 25 }, { "label": "R&D", "value": 20 }, { "label": "Support", "value": 15 } ], "bgUrl": "https://images.unsplash.com/photo-1560419015-7c427e848626?w=1280&auto=format&fit=crop&q=80", "voiceGender": "male" },
    { "id": "performance_table", "type": "table", "text": "Present Data Clearly", "narration": "For more detailed information, the table scene provides a clean, professional layout to compare features or present structured data in an easy-to-read format.", "tableHeaders": ["Feature", "Availability", "Best For"], "tableData": [ ["Bar Charts", "Available", "Comparisons"], ["Pie Charts", "Available", "Proportions"], ["HTML Scenes", "Available", "Custom Design"] ], "bgUrl": "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1280&auto=format&fit=crop&q=80", "voiceGender": "female" },
    { "id": "static_sketch", "type": "image", "text": "Illustrate Complexity", "narration": "Sometimes, you need a custom graphic. The image scene allows you to showcase complex diagrams or 'static sketches' as the centerpiece of your narrative.", "imageUrl": "https://i.ibb.co/hK4B38H/plexus-background.png", "bgUrl": "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=1280&auto=format&fit=crop&q=80", "voiceGender": "male" },
    { "id": "end", "type": "end", "text": "Create Your Story", "narration": "The power to create is now at your fingertips. What story will you tell? Thank you.", "bgUrl": "https://images.unsplash.com/photo-1534723328310-e82dad3ee43f?w=1280&auto=format&fit=crop&q=80", "voiceGender": "female" }
  ]
};

// --- Global State & Elements ---
const elements = { canvas: document.getElementById('demoCanvas'), ctx: document.getElementById('demoCanvas').getContext('2d'), statusEl: document.getElementById('status'), startBtn: document.getElementById('startBtn'), loadingOverlay: document.getElementById('loadingOverlay'), loadingText: document.getElementById('loadingText') };
let state = { isRunning: false, masterTimelineStart: 0, currentSceneIndex: -1, rafId: null, images: new Map(), particles: [], maleVoices: [], femaleVoices: [] };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

// --- Main Control Flow ---
function startShowcase() { if (state.isRunning) return; state.isRunning = true; elements.startBtn.disabled = true; elements.startBtn.textContent = "Showcase in Progress..."; speechSynthesis.cancel(); let accumulatedTime = 0; showcaseJson.scenes.forEach(scene => { const wordsPerSecond = 2.2; scene.duration = (scene.narration.split(' ').length / wordsPerSecond) * 1000 + 2000; scene.startTime = accumulatedTime; accumulatedTime += scene.duration; }); state.masterTimelineStart = performance.now(); if (!state.rafId) state.rafId = requestAnimationFrame(mainLoop); }
function endShowcase() { cancelAnimationFrame(state.rafId); state.rafId = null; state.isRunning = false; elements.startBtn.disabled = false; elements.startBtn.textContent = "Restart Showcase"; elements.statusEl.textContent = "Showcase complete!"; }

// --- Main Animation Loop (RELIABLE VERSION) ---
function mainLoop(timestamp) {
    if (!state.isRunning) { state.rafId = null; return; }
    const elapsed = timestamp - state.masterTimelineStart;
    
    let newSceneIndex = -1;
    for (let i = 0; i < showcaseJson.scenes.length; i++) {
        if (elapsed < showcaseJson.scenes[i].startTime + showcaseJson.scenes[i].duration) { newSceneIndex = i; break; }
    }
    if (newSceneIndex === -1) { endShowcase(); return; }

    if (newSceneIndex !== state.currentSceneIndex) {
        state.currentSceneIndex = newSceneIndex;
        const scene = showcaseJson.scenes[newSceneIndex];
        
        const utterance = new SpeechSynthesisUtterance(scene.narration);
        const voicePool = scene.voiceGender === 'male' ? state.maleVoices : state.femaleVoices;
        if (voicePool && voicePool.length > 0) utterance.voice = voicePool[Math.floor(Math.random() * voicePool.length)];
        else { // Failsafe voice
            const allVoices = speechSynthesis.getVoices();
            const fallbackVoice = allVoices.find(v => v.lang.startsWith('en')) || allVoices[0];
            if (fallbackVoice) utterance.voice = fallbackVoice;
        }
        
        utterance.pitch = scene.pitch || 1.0;
        speechSynthesis.speak(utterance);
    }
    
    const scene = showcaseJson.scenes[state.currentSceneIndex];
    const sceneElapsed = elapsed - scene.startTime;
    const progress = Math.min(sceneElapsed / scene.duration, 1.0);
    draw(scene, progress);
    state.rafId = requestAnimationFrame(mainLoop);
}

// --- Master Drawing Engine ---
function draw(scene, progress) { const { ctx, canvas } = elements; const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, 0.75 * canvas.height); bgGradient.addColorStop(0, '#312e81'); bgGradient.addColorStop(1, '#0f172a'); ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height); drawParticles(); const bgImg = state.images.get(scene.bgUrl); if (bgImg?.complete) { ctx.globalAlpha = 0.15; const hRatio = canvas.width / bgImg.width; const vRatio = canvas.height / bgImg.height; const ratio = Math.max(hRatio, vRatio); const centerX = (canvas.width - bgImg.width * ratio) / 2; const centerY = (canvas.height - bgImg.height * ratio) / 2; ctx.drawImage(bgImg, 0, 0, bgImg.width, bgImg.height, centerX, centerY, bgImg.width * ratio, bgImg.height * ratio); } const fadeIn = Math.min(1, easeOutCubic(progress) * 4); ctx.globalAlpha = fadeIn; const drawFns = { title, paragraph, bullet_points, image, chart, pie_chart, table, html_content, end }; (drawFns[scene.type] || title)(scene, progress); ctx.globalAlpha = 1.0; }
function createParticles() { for (let i = 0; i < 50; i++) state.particles.push({ x: Math.random() * 1280, y: Math.random() * 720, r: Math.random() * 2.5 + 0.5, a: Math.random() * 0.3 + 0.1, s: Math.random() * 0.3 + 0.1 }); }
function drawParticles() { const { ctx } = elements; ctx.fillStyle = '#ffffff'; state.particles.forEach(p => { p.y -= p.s; if (p.y < 0) p.y = 720; ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1.0; }
function drawWithGlow(drawCommands, glowColor = '#f472b6', blur = 20) { const { ctx } = elements; ctx.shadowColor = glowColor; ctx.shadowBlur = blur; drawCommands(); ctx.shadowBlur = 0; }
function wrapText(text, maxWidth) { const words = text.split(' '); let lines = [], currentLine = words[0] || ''; for (let i = 1; i < words.length; i++) { const testLine = `${currentLine} ${words[i]}`; if (elements.ctx.measureText(testLine).width < maxWidth) currentLine = testLine; else { lines.push(currentLine); currentLine = words[i]; } } lines.push(currentLine); return lines; }

// --- Animated Scene Drawing Functions (ALL PRESENT AND CORRECT) ---
function title(scene, progress) { const { ctx, canvas } = elements; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; const eased = easeOutCubic(progress); drawWithGlow(() => { ctx.font = `800 ${90 * eased}px Manrope`; ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.fillText(scene.text, canvas.width / 2, canvas.height / 2); }); }
function end(scene, progress) { title(scene, progress); }
function paragraph(scene, progress) { const { ctx, canvas } = elements; const eased = easeOutCubic(progress); ctx.textAlign = 'center'; ctx.font = '800 50px Manrope'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.globalAlpha = Math.min(1, eased * 3); ctx.fillText(scene.text, canvas.width / 2, canvas.height * 0.3); ctx.font = '400 32px Manrope'; ctx.fillStyle = 'rgba(224, 231, 255, 0.85)'; const lines = wrapText(scene.narration, canvas.width * 0.7); lines.forEach((line, i) => { const lineProgress = Math.max(0, Math.min(1, (eased - i * 0.1) / 0.5)); ctx.globalAlpha = lineProgress; ctx.fillText(line, canvas.width / 2, canvas.height * 0.5 + i * 50); }); ctx.globalAlpha = 1.0; }
function bullet_points(scene, progress) { const { ctx, canvas } = elements; const eased = easeOutCubic(progress); ctx.textAlign = 'center'; ctx.font = '800 50px Manrope'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fillText(scene.text, canvas.width / 2, canvas.height * 0.2); ctx.font = '700 32px Manrope'; ctx.textAlign = 'left'; scene.points.forEach((point, i) => { const pointProgress = Math.max(0, Math.min(1, (eased - 0.1 - i * 0.2) / 0.5)); if (pointProgress > 0) { ctx.globalAlpha = pointProgress; const y = canvas.height * 0.4 + i * 80; ctx.fillStyle = '#38bdf8'; ctx.fillText('✓', canvas.width * 0.2, y); ctx.fillStyle = '#e0e7ff'; ctx.fillText(point, canvas.width * 0.2 + 50, y); } }); ctx.globalAlpha = 1.0; }
function image(scene, progress) { const { ctx, canvas } = elements; const eased = easeOutCubic(progress); const img = state.images.get(scene.imageUrl); if (img?.complete) { const box = { x: canvas.width * 0.05, y: canvas.height * 0.1, w: canvas.width * 0.9, h: canvas.height * 0.7 }; const scale = eased; const w = box.w * scale; const h = box.h * scale; const x = box.x + (box.w - w) / 2; const y = box.y + (box.h - h) / 2; ctx.globalAlpha = scale; drawWithGlow(() => ctx.drawImage(img, x, y, w, h), 'rgba(0,0,0,0.5)', 30); } ctx.globalAlpha = eased; ctx.textAlign = 'center'; ctx.font = '800 50px Manrope'; ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; drawWithGlow(() => ctx.fillText(scene.text, canvas.width / 2, canvas.height * 0.9)); ctx.globalAlpha = 1.0; }
function html_content(scene, progress) { const { ctx, canvas } = elements; const html = scene.html || ''; const css = scene.css || ''; const svgString = `<svg width="${canvas.width}" height="${canvas.height}" xmlns="http://www.w3.org/2000/svg"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>body{margin:0;height:${canvas.height}px;display:flex;align-items:center;justify-content:center;transform: scale(${easeOutCubic(progress)}) rotate(${(1-easeOutCubic(progress)) * -5}deg); opacity: ${easeOutCubic(progress)};}${css}</style>${html}</div></foreignObject></svg>`; const img = new Image(); const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'}); const url = URL.createObjectURL(svgBlob); img.onload = () => { ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url); }; img.src = url; }
function chart(scene, progress) { const { ctx, canvas } = elements; const eased = easeOutCubic(progress); ctx.textAlign = 'center'; ctx.font = '800 50px Manrope'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fillText(scene.text, canvas.width / 2, canvas.height * 0.15); const data = scene.chartData || []; const area = { x: canvas.width * 0.15, y: canvas.height * 0.25, w: canvas.width * 0.7, h: canvas.height * 0.5 }; const maxVal = Math.max(...data.map(d => d.value)); const barWidth = area.w / (data.length * 1.5); data.forEach((item, i) => { const itemProgress = Math.max(0, Math.min(1, (eased - i * 0.1) / 0.6)); const barHeight = (item.value / maxVal) * area.h * itemProgress; const x = area.x + (i * barWidth * 1.5); const y = area.y + area.h - barHeight; const gradient = ctx.createLinearGradient(x, y, x, y + barHeight); gradient.addColorStop(0, '#38bdf8'); gradient.addColorStop(1, '#f472b6'); ctx.fillStyle = gradient; drawWithGlow(() => ctx.fillRect(x, y, barWidth, barHeight), '#38bdf8'); ctx.fillStyle = '#c7d2fe'; ctx.font = `700 20px Manrope`; ctx.globalAlpha = itemProgress; ctx.fillText(item.label, x + barWidth / 2, area.y + area.h + 30); ctx.globalAlpha = 1.0; }); }
function pie_chart(scene, progress) { const { ctx, canvas } = elements; const eased = easeOutCubic(progress); ctx.textAlign = 'center'; ctx.font = '800 50px Manrope'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fillText(scene.text, canvas.width / 2, canvas.height * 0.15); const data = scene.pieData || []; const total = data.reduce((s, i) => s + i.value, 0); const cx = canvas.width / 2, cy = canvas.height / 2 + 50, r = Math.min(canvas.width, canvas.height) / 4.5; const colors = ['#f472b6', '#38bdf8', '#34d399', '#f59e0b', '#ef4444']; let currentAngle = -0.5 * Math.PI; const angleToDraw = 2 * Math.PI * eased; data.forEach((item, i) => { const sliceAngle = (item.value / total) * angleToDraw; if (sliceAngle > 0.01) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, currentAngle, currentAngle + sliceAngle); ctx.closePath(); ctx.fillStyle = colors[i % colors.length]; drawWithGlow(() => ctx.fill(), colors[i % colors.length]); currentAngle += sliceAngle; } }); ctx.font = '700 24px Manrope'; data.forEach((item, i) => { const itemProgress = Math.max(0, Math.min(1, (eased - i * 0.1) / 0.5)); if (itemProgress > 0) { ctx.globalAlpha = itemProgress; ctx.fillStyle = colors[i % colors.length]; ctx.fillRect(canvas.width * 0.05, canvas.height * 0.3 + i * 40, 20, 20); ctx.fillStyle = '#e0e7ff'; ctx.textAlign = 'left'; ctx.fillText(`${item.label}: ${item.value}%`, canvas.width * 0.05 + 30, canvas.height * 0.3 + i * 40 + 16); } }); ctx.globalAlpha = 1.0; }
function table(scene, progress) { const { ctx, canvas } = elements; const eased = easeOutCubic(progress); ctx.textAlign = 'center'; ctx.font = '800 50px Manrope'; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fillText(scene.text, canvas.width / 2, canvas.height * 0.15); const headers = scene.tableHeaders || []; const data = scene.tableData || []; const area = { x: canvas.width * 0.1, y: canvas.height * 0.3, w: canvas.width * 0.8 }; const colW = area.w / headers.length; const rowH = 60; ctx.globalAlpha = Math.min(1, eased * 4); ctx.font = '700 24px Manrope'; ctx.fillStyle = '#38bdf8'; headers.forEach((h, i) => ctx.fillText(h, area.x + i * colW + colW / 2, area.y)); ctx.font = '400 22px Manrope'; data.forEach((row, ri) => { const rowProgress = Math.max(0, Math.min(1, (eased - 0.2 - ri * 0.1) / 0.5)); if (rowProgress > 0) { ctx.globalAlpha = rowProgress; ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.fillRect(area.x, area.y + (ri + 0.5) * rowH, area.w, rowH); ctx.fillStyle = '#e0e7ff'; row.forEach((cell, ci) => ctx.fillText(cell, area.x + ci * colW + colW / 2, area.y + (ri + 1.2) * rowH)); } }); ctx.globalAlpha = 1.0; }

// --- Preloading & Initialization ---
async function preloadAssets() {
    const { loadingText } = elements;
    loadingText.textContent = "Initializing Engine...";
    await new Promise(res => setTimeout(res, 100)); // Short delay for UI to update

    loadingText.textContent = "Warming up Narration Voices...";
    await new Promise(resolve => {
        const checkVoices = () => {
            const voices = speechSynthesis.getVoices();
            if (voices.length > 0) {
                state.maleVoices = voices.filter(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('mark')));
                state.femaleVoices = voices.filter(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha')));
                if (state.maleVoices.length === 0) state.maleVoices = voices.filter(v=>v.lang.startsWith('en')); // Fallback
                if (state.femaleVoices.length === 0) state.femaleVoices = voices.filter(v=>v.lang.startsWith('en')); // Fallback
                return resolve();
            }
        };
        checkVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = checkVoices;
        }
        setTimeout(checkVoices, 1500); // Failsafe timeout
    });
    
    const scenes = showcaseJson.scenes;
    const urls = new Set(scenes.flatMap(s => [s.bgUrl, s.imageUrl]).filter(Boolean));
    if (urls.size === 0) return;
    
    let loaded = 0;
    const promises = Array.from(urls).map(url => new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        const onFinish = () => { loaded++; loadingText.textContent = `Optimizing Asset ${loaded} of ${urls.size}...`; resolve(); };
        img.onload = () => { state.images.set(url, img); onFinish(); };
        img.onerror = () => { console.warn(`Failed to load: ${url}`); onFinish(); };
        setTimeout(onFinish, 8000); // 8-second timeout
        img.src = url;
    }));
    await Promise.all(promises);
}

window.onload = async () => {
    try {
        await preloadAssets();
        elements.loadingOverlay.style.opacity = '0';
        setTimeout(() => elements.loadingOverlay.style.display = 'none', 500);
        elements.startBtn.disabled = false;
        elements.statusEl.textContent = "Showcase is ready! Click the button to begin.";
        createParticles();
        draw(showcaseJson.scenes[0], 0);
    } catch (err) {
        elements.loadingText.textContent = "Error preparing showcase. Please refresh.";
        console.error("Initialization failed:", err);
    }
    elements.startBtn.addEventListener('click', startShowcase);
};
</script>
</body>
</html>
