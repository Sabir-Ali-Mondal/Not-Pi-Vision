<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chemistry Mechanism Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* [Keep all your existing CSS - no changes needed] */
        :root {
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-solid: #667eea;
            --secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent: #f093fb;
            --dark-bg: #0a0e27;
            --darker-bg: #060814;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.35);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: var(--darker-bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 30%, rgba(102, 126, 234, 0.18) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(118, 75, 162, 0.18) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(245, 87, 108, 0.10) 0%, transparent 50%);
            animation: bgPulse 16s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgPulse {

            0%,
            100% {
                opacity: .6;
            }

            50% {
                opacity: 1;
            }
        }

        main {
            position: relative;
            z-index: 1;
            padding: 2rem;
            min-height: 100vh;
        }

        .message-state {
            text-align: center;
            margin: 15vh auto;
            max-width: 600px;
        }

        .message-state .icon {
            font-size: 4.6rem;
            margin-bottom: 1rem;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-state h2 {
            font-size: 2.1rem;
            font-weight: 900;
        }

        .step-container {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2.2rem;
            margin: 0 auto 2.2rem auto;
            max-width: 1000px;
            animation: fadeInScale .45s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(.965)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        .step-container h3 {
            margin: 0 0 .7rem 0;
            font-size: 1.6rem;
            font-weight: 900;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .step-container p {
            margin: 0 0 1.3rem 0;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .badge-row {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .35rem .6rem;
            border-radius: 999px;
            font-size: .78rem;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
        }

        .canvas-box {
            position: relative;
            width: 100%;
            height: 340px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, .35);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 1.5rem;
            cursor: grab;
        }

        .canvas-controls {
            position: absolute;
            top: .75rem;
            right: .75rem;
            z-index: 5;
            display: flex;
            gap: 0.5rem;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .step-divider {
            text-align: center;
            font-size: 3.2rem;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 auto 1.6rem auto;
            max-width: 1000px;
        }
    </style>
</head>

<body>
    <main id="overviewContainer">
        <div class="message-state" id="initialState">
            <div class="icon"><i class="bi bi-gear-fill"></i></div>
            <h2>Loading Content...</h2>
            <p id="statusMessage">Attempting to read mechanism data from URL fragment.</p>
        </div>
    </main>

    <script>
        // ========= CONSTANTS =========
        const ATOM_COLORS = {
            C: "#404040",
            H: "#ffffff",
            O: "#ef4444",
            N: "#3b82f6",
            Br: "#a16207",
            Cl: "#16a34a",
            F: "#22c55e",
            S: "#f59e0b",
            Al: "#a8a29e",
            R: "#9ca3af"
        };

        let stepAnimations = [];
        let globalBounds = null;
        let narrationEnabled = false;

        const $ = (id) => document.getElementById(id);

        // ========= DEFAULT EXAMPLE DATA (using let) =========
        let mechanismData = {
            mechanism: [{
                    step: 1,
                    title: "Nucleophilic Attack",
                    description: "Hydroxide ion attacks the electrophilic carbon",
                    displayMolecules: ["substrate", "nucleophile"],
                    animationHints: [{
                        type: "curlyArrow",
                        fromBond: "nucleophile:lone-pair",
                        to: "substrate:C1",
                        flip: false
                    }]
                },
                {
                    step: 2,
                    title: "Leaving Group Departure",
                    description: "Bromide leaves as the bond breaks",
                    displayMolecules: ["intermediate", "leaving-group"],
                    animationHints: []
                }
            ],
            molecules: {
                substrate: {
                    position: {
                        x: -100,
                        y: 0
                    },
                    atoms: [{
                            id: "C1",
                            element: "C",
                            position: {
                                x: 0,
                                y: 0
                            },
                            charge: 0
                        },
                        {
                            id: "Br1",
                            element: "Br",
                            position: {
                                x: 50,
                                y: 0
                            },
                            charge: 0
                        },
                        {
                            id: "H1",
                            element: "H",
                            position: {
                                x: -25,
                                y: -25
                            },
                            charge: 0
                        },
                        {
                            id: "H2",
                            element: "H",
                            position: {
                                x: -25,
                                y: 25
                            },
                            charge: 0
                        }
                    ],
                    bonds: [{
                            id: "b1",
                            from: "C1",
                            to: "Br1",
                            type: "single"
                        },
                        {
                            id: "b2",
                            from: "C1",
                            to: "H1",
                            type: "single"
                        },
                        {
                            id: "b3",
                            from: "C1",
                            to: "H2",
                            type: "single"
                        }
                    ]
                },
                nucleophile: {
                    position: {
                        x: -200,
                        y: 0
                    },
                    atoms: [{
                        id: "O1",
                        element: "O",
                        position: {
                            x: 0,
                            y: 0
                        },
                        charge: -1
                    }],
                    bonds: []
                },
                intermediate: {
                    position: {
                        x: 0,
                        y: 0
                    },
                    atoms: [{
                            id: "C1",
                            element: "C",
                            position: {
                                x: 0,
                                y: 0
                            },
                            charge: 0
                        },
                        {
                            id: "O1",
                            element: "O",
                            position: {
                                x: -50,
                                y: 0
                            },
                            charge: 0
                        },
                        {
                            id: "H1",
                            element: "H",
                            position: {
                                x: 25,
                                y: -25
                            },
                            charge: 0
                        },
                        {
                            id: "H2",
                            element: "H",
                            position: {
                                x: 25,
                                y: 25
                            },
                            charge: 0
                        }
                    ],
                    bonds: [{
                            id: "b1",
                            from: "C1",
                            to: "O1",
                            type: "single"
                        },
                        {
                            id: "b2",
                            from: "C1",
                            to: "H1",
                            type: "single"
                        },
                        {
                            id: "b3",
                            from: "C1",
                            to: "H2",
                            type: "single"
                        }
                    ]
                },
                "leaving-group": {
                    position: {
                        x: 100,
                        y: 0
                    },
                    atoms: [{
                        id: "Br1",
                        element: "Br",
                        position: {
                            x: 0,
                            y: 0
                        },
                        charge: -1
                    }],
                    bonds: []
                }
            }
        };

        // ========= LOAD DATA FROM URL (if available) =========
        if (window.location.hash.includes('#data=')) {
            try {
                mechanismData = JSON.parse(decodeURIComponent(
                    window.location.hash.substring(window.location.hash.indexOf('#data=') + 6)
                ));
                console.log('✓ Data loaded from URL');
            } catch (e) {
                console.error('Failed to load URL data:', e);
            }
        }

        // ========= INITIALIZATION =========
        document.addEventListener('DOMContentLoaded', initializeViewer);

        function initializeViewer() {
            // mechanismData is already set (either default or from URL)
            renderOverview();
        }

        function displayError(title, message) {
            const container = $("overviewContainer");
            container.innerHTML = `
                <div class="message-state">
                    <div class="icon" style="background: var(--secondary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><i class="bi bi-x-circle-fill"></i></div>
                    <h2>${title}</h2>
                    <p class="text-secondary">${message}</p>
                </div>
            `;
        }

        // ========= CORE RENDERING LOGIC =========
        function renderOverview() {
            stepAnimations.forEach(instance => instance.remove());
            stepAnimations = [];
            const container = $("overviewContainer");
            container.innerHTML = "";

            globalBounds = calculateGlobalBounds(mechanismData);

            mechanismData.mechanism.forEach((step, index) => {
                const stepElement = createStepElement(step, index);
                container.appendChild(stepElement);

                const animation = new p5(createStepAnimation(step, globalBounds), `canvas-box-${index}`);
                stepAnimations.push(animation);

                if (index < mechanismData.mechanism.length - 1) {
                    const divider = document.createElement("div");
                    divider.className = "step-divider";
                    divider.innerHTML = "↓";
                    container.appendChild(divider);
                }
            });
        }

        function createStepElement(step, index) {
            const stepContainer = document.createElement("div");
            stepContainer.className = "step-container";
            const badges = computeStepBadges(step);
            const badgeHTML = badges.map(b => `<span class="badge"><i class="bi ${b.icon}"></i> ${b.text}</span>`).join('');

            stepContainer.innerHTML = `
                <h3>Step ${step.step || index + 1}: ${step.title || "Untitled"}</h3>
                <p>${step.description || "No description provided."}</p>
                <div class="badge-row">${badgeHTML}</div>
                <div class="canvas-box" id="canvas-box-${index}">
                     <div class="canvas-controls">
                        <button class="btn-control" id="narrate-btn-${index}" title="Narrate Step" disabled><i class="bi bi-volume-up-fill"></i></button>
                        <button class="btn-control" id="reset-view-${index}" title="Reset View"><i class="bi bi-arrow-counterclockwise"></i></button>
                    </div>
                </div>`;
            return stepContainer;
        }

        // ========= P5.JS ANIMATION IMPLEMENTATION =========
        function createStepAnimation(step, bounds) {
            return (p) => {
                let scaleFactor, panX, panY, initialScale, initialPanX, initialPanY;
                let isDragging = false,
                    lastMouseX = 0,
                    lastMouseY = 0;

                p.setup = () => {
                    const parent = p.canvas.parentElement;
                    p.createCanvas(parent.clientWidth, parent.clientHeight);
                    p.textFont("Inter");

                    const padding = 1.5;
                    initialScale = Math.min(p.width / (bounds.width * padding), p.height / (bounds.height * padding));
                    initialPanX = p.width / 2 - bounds.centerX * initialScale;
                    initialPanY = p.height / 2 - bounds.centerY * initialScale;

                    p.resetView = () => {
                        scaleFactor = initialScale;
                        panX = initialPanX;
                        panY = initialPanY;
                    };
                    p.resetView();
                    const resetBtn = parent.querySelector(`#reset-view-${step.step - 1 || step.step || 0}`);
                    if (resetBtn) resetBtn.onclick = p.resetView;
                };

                p.mousePressed = () => {
                    if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
                        isDragging = true;
                        lastMouseX = p.mouseX;
                        lastMouseY = p.mouseY;
                    }
                };
                p.mouseReleased = () => isDragging = false;
                p.mouseDragged = () => {
                    if (isDragging) {
                        panX += p.mouseX - lastMouseX;
                        panY += p.mouseY - lastMouseY;
                        lastMouseX = p.mouseX;
                        lastMouseY = p.mouseY;
                    }
                };
                p.mouseWheel = (event) => {
                    if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
                        event.preventDefault();
                        const s = scaleFactor * (1 - event.delta * 0.001);
                        if (s > 0.1 && s < 20) {
                            const wx = (p.mouseX - panX) / scaleFactor,
                                wy = (p.mouseY - panY) / scaleFactor;
                            panX = p.mouseX - wx * s;
                            panY = p.mouseY - wy * s;
                            scaleFactor = s;
                        }
                    }
                };

                p.draw = () => {
                    p.background(6, 8, 20);
                    const tempMolecules = JSON.parse(JSON.stringify(mechanismData.molecules));

                    p.push();
                    p.translate(panX, panY);
                    p.scale(scaleFactor);
                    drawMolecules(p, step.displayMolecules, tempMolecules);

                    const animationProgress = (p.millis() % 3000) / 3000.0;
                    drawAnimationHints(p, step, tempMolecules, animationProgress);
                    p.pop();
                };
            };
        }

        // ========= UTILITY FUNCTIONS =========
        function calculateGlobalBounds(data) {
            let minX = Infinity,
                minY = Infinity,
                maxX = -Infinity,
                maxY = -Infinity,
                c = 0;
            const allMolKeys = new Set();
            data.mechanism.forEach(s => s.displayMolecules.forEach(k => allMolKeys.add(k)));

            for (const k of allMolKeys) {
                const m = data.molecules[k];
                if (!m || !m.atoms) continue;
                const mx = m.position?.x || 0,
                    my = m.position?.y || 0;
                for (const a of m.atoms) {
                    const x = a.position.x + mx,
                        y = a.position.y + my;
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                    c++;
                }
            }

            if (c === 0) return {
                centerX: 0,
                centerY: 0,
                width: 100,
                height: 100
            };
            return {
                centerX: (minX + maxX) / 2,
                centerY: (minY + maxY) / 2,
                width: Math.max(100, maxX - minX),
                height: Math.max(100, maxY - minY)
            };
        }

        function computeStepBadges(step) {
            const badges = [];
            const title = (step.title || "").toLowerCase();
            const desc = (step.description || "").toLowerCase();

            if (title.includes("protonation") || desc.includes("protonation")) badges.push({
                text: "Proton Transfer",
                icon: "bi-plus-circle-fill"
            });
            if (title.includes("nucleophilic") || desc.includes("attack")) badges.push({
                text: "Nucleophilic Attack",
                icon: "bi-arrow-down-left"
            });
            if (title.includes("radical")) badges.push({
                text: "Radical",
                icon: "bi-lightning-fill"
            });
            if (title.includes("sn2") || desc.includes("sn2")) badges.push({
                text: "SN2",
                icon: "bi-arrow-left-right"
            });
            if (step.animationHints?.length > 0) badges.push({
                text: "Animated",
                icon: "bi-film"
            });
            return badges;
        }

        function drawMolecules(p, molKeys, allMolecules) {
            for (const key of molKeys) {
                const mol = allMolecules[key];
                if (!mol) continue;
                p.push();
                p.translate(mol.position?.x || 0, mol.position?.y || 0);
                if (mol.bonds) drawBonds(p, mol);
                if (mol.atoms) drawAtoms(p, mol);
                p.pop();
            }
        }

        function drawBonds(p, molecule) {
            for (const bond of molecule.bonds) {
                const a1 = molecule.atoms.find(a => a.id === bond.from);
                const a2 = molecule.atoms.find(a => a.id === bond.to);
                if (!a1 || !a2) continue;
                p.stroke(255, 150);
                p.strokeWeight(4);
                const [x1, y1, x2, y2] = [a1.position.x, a1.position.y, a2.position.x, a2.position.y];
                switch (bond.type) {
                    case "double": {
                        const o = 5,
                            a = p.atan2(y2 - y1, x2 - x1) + p.HALF_PI;
                        const dx = o * p.cos(a),
                            dy = o * p.sin(a);
                        p.line(x1 + dx, y1 + dy, x2 + dx, y2 + dy);
                        p.line(x1 - dx, y1 - dy, x2 - dx, y2 - dy);
                        break;
                    }
                    case "wedge": {
                        p.fill(255, 150);
                        p.noStroke();
                        const a = p.atan2(y2 - y1, x2 - x1) + p.HALF_PI;
                        p.triangle(x1, y1, x2 + 8 * p.cos(a), y2 + 8 * p.sin(a), x2 - 8 * p.cos(a), y2 - 8 * p.sin(a));
                        break;
                    }
                    case "dash": {
                        p.drawingContext.setLineDash([6, 8]);
                        p.line(x1, y1, x2, y2);
                        p.drawingContext.setLineDash([]);
                        break;
                    }
                    default:
                        p.line(x1, y1, x2, y2);
                }
            }
        }

        function drawAtoms(p, molecule) {
            for (const atom of molecule.atoms) {
                const color = ATOM_COLORS[atom.element] || "#94a3b8";
                const size = atom.element === "H" ? 12 : 16;
                p.fill(color);
                p.stroke(255, 120);
                p.strokeWeight(2);
                p.ellipse(atom.position.x, atom.position.y, size * 2);

                if (atom.element !== "C" || molecule.atoms.length < 2) {
                    p.fill(atom.element === "H" ? "#000" : "#fff");
                    p.noStroke();
                    p.textAlign(p.CENTER, p.CENTER);
                    p.textSize(size * 0.9);
                    p.textStyle(p.BOLD);
                    p.text(atom.element, atom.position.x, atom.position.y + 1);
                }

                if (atom.charge) {
                    p.fill(atom.charge > 0 ? "#ef4444" : "#3b82f6");
                    p.noStroke();
                    p.textSize(size * 0.85);
                    const cs = (atom.charge > 0 ? "+" : "−") + (Math.abs(atom.charge) > 1 ? Math.abs(atom.charge) : "");
                    p.text(cs, atom.position.x + size * 0.9, atom.position.y - size * 0.9);
                }
                if (atom.radical) {
                    p.fill("#ef4444");
                    p.noStroke();
                    p.circle(atom.position.x + size * 0.9, atom.position.y - size * 0.9, size * 0.35);
                }
            }
        }

        function drawAnimationHints(p, step, allMolecules, progress) {
            if (!step.animationHints) return;

            const findPoint = (id) => {
                if (!id) return null;
                const [molKey, atomId] = id.split(':');
                const mol = allMolecules[molKey];
                if (!mol) return null;
                const atom = mol.atoms.find(a => a.id === atomId);
                if (!atom) return null;
                return {
                    x: atom.position.x + (mol.position?.x || 0),
                    y: atom.position.y + (mol.position?.y || 0)
                };
            };

            const findBondMidpoint = (id) => {
                if (!id) return null;
                const [molKey, bondId] = id.split(':');
                const mol = allMolecules[molKey];
                if (!mol) return null;
                const bond = mol.bonds.find(b => b.id === bondId);
                if (!bond) return null;
                const a1 = findPoint(`${molKey}:${bond.from}`);
                const a2 = findPoint(`${molKey}:${bond.to}`);
                if (!a1 || !a2) return null;
                return {
                    x: (a1.x + a2.x) / 2,
                    y: (a1.y + a2.y) / 2
                };
            };

            for (const hint of step.animationHints) {
                const toPoint = findPoint(hint.to);
                const fromPoint = hint.from ? findPoint(hint.from) : findBondMidpoint(hint.fromBond);
                if (!fromPoint || !toPoint) continue;

                const d = p.dist(fromPoint.x, fromPoint.y, toPoint.x, toPoint.y);
                const angle = p.atan2(toPoint.y - fromPoint.y, toPoint.x - fromPoint.x);
                const ctrlOffset = d * 0.4;

                const c1x = fromPoint.x + ctrlOffset * p.cos(angle + p.HALF_PI);
                const c1y = fromPoint.y + ctrlOffset * p.sin(angle + p.HALF_PI);
                const c2x = toPoint.x + ctrlOffset * p.cos(angle + p.HALF_PI);
                const c2y = toPoint.y + ctrlOffset * p.sin(angle + p.HALF_PI);

                p.noFill();
                p.strokeWeight(2.5);
                p.stroke(p.color(getComputedStyle(document.documentElement).getPropertyValue('--accent')), 180);
                p.bezier(fromPoint.x, fromPoint.y, c1x, c1y, c2x, c2y, toPoint.x, toPoint.y);

                const t = progress;
                const x = p.bezierPoint(fromPoint.x, c1x, c2x, toPoint.x, t);
                const y = p.bezierPoint(fromPoint.y, c1y, c2y, toPoint.y, t);

                p.push();
                p.translate(x, y);

                const tx = p.bezierTangent(fromPoint.x, c1x, c2x, toPoint.x, t);
                const ty = p.bezierTangent(fromPoint.y, c1y, c2y, toPoint.y, t);
                p.rotate(p.atan2(ty, tx));

                p.fill(p.color(getComputedStyle(document.documentElement).getPropertyValue('--accent')));
                p.stroke(p.color(getComputedStyle(document.documentElement).getPropertyValue('--accent')));
                p.strokeWeight(2);

                if (hint.type === 'curlyArrow') {
                    p.line(0, 0, -10, -7);
                    p.line(0, 0, -10, 7);
                } else if (hint.type === 'fishhookArrow') {
                    p.line(0, 0, -10, hint.flip ? 7 : -7);
                } else {
                    p.line(0, 0, -10, -7);
                    p.line(0, 0, -10, 7);
                }
                p.pop();
            }
        }
    </script>
