<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Content Viewer</title>
    <style>
        /* BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --accent-color: #f59e0b;
            --bg-main: #fef3e2;
            --bg-content: #fffbf0;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-light: #fde68a;
            --shadow-soft: 0 2px 8px rgba(251, 191, 36, 0.15);
            --shadow-medium: 0 4px 16px rgba(251, 191, 36, 0.2);
            --highlight-bg: #fef3c7;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fef3e2 0%, #fde68a 100%);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.8;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .content-area {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-medium);
            min-height: 500px;
            border: 2px solid var(--border-light);
        }

        .page-card {
            display: none;
            animation: slideIn 0.4s ease;
        }

        .page-card.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-15px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .page-card p {
            margin: 1.3rem 0;
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-primary);
        }

        .page-card strong {
            font-weight: 700;
            font-size: 1.5rem;
            display: block;
            margin: 2rem 0 1.2rem 0;
            padding-bottom: 0.6rem;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, currentColor, transparent) 1;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 2rem 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--border-light);
        }

        th {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            padding: 1.1rem;
            text-align: left;
            font-weight: 600;
            font-size: 1.05rem;
        }

        td {
            padding: 1.1rem;
            border-bottom: 1px solid var(--border-light);
            background: var(--card-bg);
            color: var(--text-primary);
        }

        tr:hover td {
            background: var(--highlight-bg);
            transition: all 0.2s ease;
        }

        ol,
        ul {
            margin: 1.8rem 0 1.8rem 2rem;
        }

        li {
            margin: 1.1rem 0;
            padding-left: 0.6rem;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        ol {
            counter-reset: list-counter;
            list-style: none;
        }

        ol li {
            counter-increment: list-counter;
            position: relative;
            padding-left: 3rem;
        }

        ol li::before {
            content: counter(list-counter);
            position: absolute;
            left: 0;
            top: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.7rem 1.4rem;
            background: linear-gradient(135deg, var(--secondary-color), #059669);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin: 0.6rem 0.6rem 0.6rem 0;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
        }

        svg {
            max-width: 100%;
            height: auto;
            margin: 2.5rem auto;
            display: block;
            padding: 2rem;
            background: var(--bg-content);
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            border: 2px solid var(--border-light);
        }

        math {
            font-size: 1.3rem;
            margin: 2.5rem 0;
            display: block;
            text-align: center;
            padding: 2rem;
            background: var(--highlight-bg);
            border-radius: 12px;
            border-left: 4px solid var(--accent-color);
            box-shadow: var(--shadow-soft);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border-light);
        }

        .pagination button {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .message-state {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-secondary);
        }

        .error-message {
            color: #dc2626;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: var(--primary-color);
            width: 30px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="contentArea" class="content-area">
            <div id="contentDisplay">
                <div class="message-state">
                    <h1>Viewer Initialized</h1>
                    <p class="error-message" id="initialMessage">Loading content...</p>
                </div>
            </div>

            <div class="progress-dots" id="progressDots"></div>

            <div class="pagination" id="paginationControls" style="display: none;">
                <button onclick="prevPage()" id="prevBtn"><span class="icon-nav">◀</span> Prev</button>
                <div class="page-indicator">
                    Page <span class="current" id="currentPageNum">0</span> of <span id="totalPages">0</span>
                </div>
                <button onclick="nextPage()" id="nextBtn">Next <span class="icon-nav">▶</span></button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let totalPagesCount = 0;

        // ========= DEFAULT EXAMPLE DATA (using let) =========
        let pagesData = [{
                content: `
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Welcome to Web Development</h1>
                    <p style="color: var(--text-secondary); font-size: 1.2rem; margin-bottom: 2rem;">A comprehensive introduction to building websites</p>
                    <p>Web development is the process of creating websites and web applications. It combines creativity with technical skills to build engaging online experiences.</p>
                    
                    <strong>What You'll Learn</strong>
                    <ul>
                        <li>HTML - Structure your content</li>
                        <li>CSS - Style your pages</li>
                        <li>JavaScript - Add interactivity</li>
                        <li>Best practices and modern workflows</li>
                    </ul>
                    
                    <p>This tutorial will guide you through the fundamentals of web development, from basic concepts to advanced techniques.</p>
                `
            },
            {
                content: `
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">HTML Basics</h1>
                    
                    <p>HTML (HyperText Markup Language) is the foundation of every website. It provides structure and meaning to your content.</p>
                    
                    <strong>Core HTML Elements</strong>
                    <ol>
                        <li><strong>Headings:</strong> h1 to h6 for hierarchical structure</li>
                        <li><strong>Paragraphs:</strong> p tags for text content</li>
                        <li><strong>Links:</strong> a tags for navigation</li>
                        <li><strong>Images:</strong> img tags for visual content</li>
                        <li><strong>Lists:</strong> ul and ol for organized information</li>
                    </ol>
                    
                    <strong>HTML Document Structure</strong>
                    <table>
                        <thead>
                            <tr>
                                <th>Tag</th>
                                <th>Purpose</th>
                                <th>Required</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>&lt;!DOCTYPE html&gt;</td>
                                <td>Declares HTML5 document</td>
                                <td>Yes</td>
                            </tr>
                            <tr>
                                <td>&lt;html&gt;</td>
                                <td>Root element</td>
                                <td>Yes</td>
                            </tr>
                            <tr>
                                <td>&lt;head&gt;</td>
                                <td>Contains metadata</td>
                                <td>Yes</td>
                            </tr>
                            <tr>
                                <td>&lt;body&gt;</td>
                                <td>Contains visible content</td>
                                <td>Yes</td>
                            </tr>
                        </tbody>
                    </table>
                `
            },
            {
                content: `
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">CSS Styling</h1>
                    
                    <p>CSS (Cascading Style Sheets) brings your HTML to life with colors, layouts, animations, and responsive designs.</p>
                    
                    <strong>CSS Selectors</strong>
                    <ul>
                        <li><strong>Element Selector:</strong> Targets all elements of a type</li>
                        <li><strong>Class Selector:</strong> Targets elements with specific class</li>
                        <li><strong>ID Selector:</strong> Targets unique element</li>
                        <li><strong>Attribute Selector:</strong> Targets based on attributes</li>
                    </ul>
                    
                    <strong>Modern CSS Features</strong>
                    <ol>
                        <li>Flexbox - One-dimensional layouts</li>
                        <li>Grid - Two-dimensional layouts</li>
                        <li>Custom Properties - CSS variables</li>
                        <li>Animations - Smooth transitions</li>
                        <li>Media Queries - Responsive design</li>
                    </ol>
                    
                    <p style="background: var(--highlight-bg); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--accent-color);">
                        <strong>Pro Tip:</strong> Use CSS Grid for page layouts and Flexbox for component alignment. Together, they provide powerful layout control.
                    </p>
                `
            },
            {
                content: `
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">JavaScript Fundamentals</h1>
                    
                    <p>JavaScript adds interactivity to your websites, allowing you to create dynamic user experiences and handle user input.</p>
                    
                    <strong>Core Concepts</strong>
                    <table>
                        <thead>
                            <tr>
                                <th>Concept</th>
                                <th>Description</th>
                                <th>Example Use</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Variables</td>
                                <td>Store data values</td>
                                <td>let name = 'John'</td>
                            </tr>
                            <tr>
                                <td>Functions</td>
                                <td>Reusable code blocks</td>
                                <td>function greet() { }</td>
                            </tr>
                            <tr>
                                <td>Events</td>
                                <td>User interactions</td>
                                <td>button.onclick</td>
                            </tr>
                            <tr>
                                <td>DOM</td>
                                <td>Manipulate HTML</td>
                                <td>document.querySelector()</td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <strong>Modern JavaScript</strong>
                    <ul>
                        <li>Arrow Functions - Concise function syntax</li>
                        <li>Template Literals - String interpolation</li>
                        <li>Destructuring - Extract values easily</li>
                        <li>Async/Await - Handle asynchronous code</li>
                        <li>Modules - Organize code into files</li>
                    </ul>
                `
            },
            {
                content: `
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Next Steps</h1>
                    
                    <p>Congratulations on completing this introduction! Here's how to continue your web development journey.</p>
                    
                    <strong>Practice Projects</strong>
                    <ol>
                        <li>Build a personal portfolio website</li>
                        <li>Create a responsive blog layout</li>
                        <li>Develop an interactive to-do list</li>
                        <li>Design a landing page</li>
                        <li>Make a simple web game</li>
                    </ol>
                    
                    <strong>Learning Resources</strong>
                    <ul>
                        <li><a href="#">MDN Web Docs - Comprehensive documentation</a></li>
                        <li><a href="#">freeCodeCamp - Free interactive courses</a></li>
                        <li><a href="#">CSS-Tricks - CSS tutorials and tips</a></li>
                        <li><a href="#">JavaScript.info - Modern JavaScript tutorial</a></li>
                    </ul>
                    
                    <p style="background: linear-gradient(135deg, var(--primary-color), #2563eb); color: white; padding: 2rem; border-radius: 12px; text-align: center; font-size: 1.2rem; font-weight: 600;">
                        Keep learning, keep building, and enjoy the journey! 🚀
                    </p>
                `
            }
        ];

        // ========= LOAD DATA FROM URL (if available) =========
        if (window.location.hash.includes('#data=')) {
            try {
                pagesData = JSON.parse(decodeURIComponent(
                    window.location.hash.substring(window.location.hash.indexOf('#data=') + 6)
                ));
                console.log('✓ Data loaded from URL');
            } catch (e) {
                console.error('Failed to load URL data:', e);
            }
        }

        // ========= INITIALIZATION =========
        document.addEventListener('DOMContentLoaded', initializeViewer);

        function initializeViewer() {
            // Validate pagesData
            if (!Array.isArray(pagesData) || pagesData.length === 0 || !pagesData[0].content) {
                return displayError('Invalid data structure. Please check your content format.', true);
            }

            totalPagesCount = pagesData.length;

            // Render UI
            renderProgressDots();
            renderPage(0);
            document.getElementById('paginationControls').style.display = 'flex';
        }

        function displayError(message, isFatal = false) {
            const contentDisplay = document.getElementById('contentDisplay');
            if (isFatal) {
                contentDisplay.innerHTML = `
                    <div class="message-state">
                        <h1>Content Load Failed</h1>
                        <p class="error-message">${message}</p>
                    </div>
                `;
                document.getElementById('paginationControls').style.display = 'none';
                document.getElementById('progressDots').innerHTML = '';
            }
        }

        // --- Viewer Rendering Logic ---

        function renderProgressDots() {
            const dotsContainer = document.getElementById('progressDots');
            dotsContainer.innerHTML = '';

            for (let i = 0; i < totalPagesCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.onclick = () => goToPage(i);
                dot.title = `Page ${i + 1}`;
                dotsContainer.appendChild(dot);
            }

            updateProgressDots();
        }

        function updateProgressDots() {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentPage);
            });
        }

        function renderPage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPagesCount) return;

            currentPage = pageIndex;
            const contentDisplay = document.getElementById('contentDisplay');
            const pageData = pagesData[pageIndex];

            contentDisplay.innerHTML = `<div class="page-card active">${pageData.content}</div>`;

            document.getElementById('currentPageNum').textContent = currentPage + 1;
            document.getElementById('totalPages').textContent = totalPagesCount;

            updateProgressDots();
            updatePaginationButtons();
        }

        function updatePaginationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === totalPagesCount - 1;
        }

        function prevPage() {
            if (currentPage > 0) {
                renderPage(currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < totalPagesCount - 1) {
                renderPage(currentPage + 1);
            }
        }

        function goToPage(pageIndex) {
            renderPage(pageIndex);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
        });
    </script>
</body>

</html>
