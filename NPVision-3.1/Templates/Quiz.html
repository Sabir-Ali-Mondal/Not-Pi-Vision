<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Advanced Interactive Learning Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
<style>
  /* Base Styles */
  :root {
    --primary-color: #3f51b5; /* Indigo */
    --primary-light: #7986cb;
    --secondary-color: #ffc107; /* Amber */
    --background-light: #f4f6f9;
    --background-dark: #e0e0e0;
    --success-color: #4caf50;
    --error-color: #f44336;
    --text-dark: #212121;
    --text-light: #555;
    --border-radius: 12px;
  }

  body {
    font-family: 'Roboto', sans-serif;
    background: var(--background-light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .quiz-box {
    background: #fff;
    width: 95%;
    max-width: 750px;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    transition: all 0.4s ease;
  }
  h1 {
    font-family: 'Montserrat', sans-serif;
    margin-bottom: 25px;
    color: var(--primary-color);
    font-weight: 800;
    font-size: 2em;
    border-bottom: 3px solid var(--secondary-color);
    padding-bottom: 10px;
  }
  
  /* Input Area */
  #quizInput {
    width: 100%;
    height: 150px;
    border: 1px solid var(--background-dark);
    border-radius: var(--border-radius);
    padding: 15px;
    font-family: monospace;
    font-size: 14px;
    margin-bottom: 20px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  }

  /* Info Bar */
  #infoBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: #e3f2fd;
      border-radius: var(--border-radius);
      font-weight: 700;
      color: var(--primary-color);
      border-left: 5px solid var(--primary-color);
  }
  .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
  }
  .info-item span {
      font-family: 'Montserrat', sans-serif;
  }

  /* Progress Bar */
  #progressBarContainer {
    width: 100%;
    background-color: var(--background-dark);
    border-radius: 5px;
    margin-top: 15px;
    height: 10px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background-color: var(--secondary-color);
    transition: width 0.4s ease;
  }
  
  /* Question Area */
  .question {
    font-size: 1.3em;
    font-weight: 700;
    margin-bottom: 30px;
    color: var(--text-dark);
    line-height: 1.5;
    text-align: left;
    min-height: 50px;
  }

  /* Code Block Styling */
  .question pre, .question code {
    background: #272822; 
    color: #f8f8f2;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
    display: block;
    margin-top: 10px;
  }
  
  /* SVG/Image Container */
  .visual-content {
      margin: 15px auto;
      border: 1px solid var(--background-dark);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      max-width: 90%;
  }
  .visual-content svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
  }

  /* Options Styling */
  .options {
    list-style: none;
    padding: 0;
    margin-bottom: 30px;
  }
  .options li {
    background: var(--background-light);
    border: 2px solid var(--background-dark);
    border-radius: var(--border-radius);
    margin: 12px 0;
    padding: 15px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    text-align: left;
    font-weight: 500;
    color: var(--text-dark);
  }
  .options li:hover:not([data-checked]) {
    background: var(--primary-light);
    color: white;
    border-color: var(--primary-color);
    transform: translateY(-2px);
  }

  /* Feedback Classes */
  .correct {
    background: var(--success-color) !important;
    color: white !important;
    border-color: var(--success-color) !important;
    box-shadow: 0 4px 8px rgba(76, 175, 80, 0.4);
  }
  .wrong {
    background: var(--error-color) !important;
    color: white !important;
    border-color: var(--error-color) !important;
    box-shadow: 0 4px 8px rgba(244, 67, 54, 0.4);
  }
  
  /* Buttons */
  button {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 10px;
    font-size: 1.1em;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.2s;
    box-shadow: 0 4px 10px rgba(63, 81, 181, 0.3);
  }
</style>
</head>
<body>

<div class="quiz-box">
  <h1>Interactive Learning Assessment</h1>
  <textarea id="quizInput" placeholder="Paste your quiz JSON data here..." ></textarea>
  <button onclick="startQuiz()">Start Quiz</button>
  
  <div id="quizArea" style="display:none;">
    
    <!-- New Info Bar -->
    <div id="infoBar">
        <div class="info-item">Score: <span id="currentScore">0</span>/<span id="maxScore">0</span></div>
        <div class="info-item">Time: <span id="quizTimer">00:00</span></div>
        <div class="info-item">Progress: <span id="currentProgress">0</span>/<span id="totalQuestions">0</span></div>
    </div>
    
    <div id="progressBarContainer"><div id="progressBar"></div></div>

    <div class="question" id="question"></div>
    <div id="visualContent" class="visual-content" style="display:none;"></div>
    
    <ul class="options" id="options"></ul>
    <div id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question &gt;</button>
  </div>
</div>

<script>
let presentationData = {
  "questions": [
    {
      "question": "What is the primary function of DNA helicase during replication?",
      "options": [
        "It joins Okazaki fragments.",
        "It unwinds the DNA double helix.",
        "It synthesizes RNA primers.",
        "It seals the DNA backbone."
      ],
      "answerIndex": 1
    },
    {
      "question": "Which enzyme synthesizes short RNA sequences to start DNA synthesis?",
      "options": [
        "DNA polymerase III",
        "Helicase",
        "Primase",
        "Ligase"
      ],
      "answerIndex": 2
    },
    {
      // Example of an invalid question (answerIndex 5 for 4 options)
      "question": "This question should be denied due to an invalid answer index.",
      "options": ["A", "B", "C", "D"],
      "answerIndex": 5 
    }
  ]
};

// ... (Data Updater function remains the same) ...
(function() {
  const hash = window.location.hash;
  if (!hash || !hash.includes('#data=')) return;
  try {
    const encodedData = hash.substring(hash.indexOf('#data=') + 6);
    const jsonString = decodeURIComponent(encodedData);
    const loadedData = JSON.parse(jsonString);
    if (loadedData && loadedData.questions) {
        presentationData = loadedData;
        console.log('✓ Data loaded from URL');
    }
  } catch (error) {
    console.error('Failed to load data from URL hash:', error);
  }
})();


let quizData = null;
let currentQuestion = 0;
let score = 0;
let maxScore = 0;
let startTime = 0;
let timerInterval = null;

window.onload = function() {
  document.getElementById("quizInput").value = JSON.stringify(presentationData, null, 2);
};

// Helper function: Fisher-Yates (Knuth) Shuffle
function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
  return array;
}

function processQuizData(data) {
  const processedQuestions = [];
  
  data.questions.forEach((q, originalIndex) => {
    // 1. Validation Check: Deny question if answer index is out of bounds
    if (q.answerIndex === undefined || 
        q.answerIndex < 0 || 
        q.answerIndex >= q.options.length) {
      console.warn(`Question ${originalIndex + 1} denied: Invalid answer index (${q.answerIndex} for ${q.options.length} options).`);
      return; // Skip this question
    }
    
    // 2. Shuffling Logic
    const originalOptions = [...q.options];
    const correctText = originalOptions[q.answerIndex];
    
    const optionsToShuffle = [...originalOptions];
    shuffleArray(optionsToShuffle);
    
    // Find the new index of the correct answer
    const newAnswerIndex = optionsToShuffle.findIndex(opt => opt === correctText);
    
    // Clone and update the question object
    processedQuestions.push({
      ...q,
      options: optionsToShuffle,
      answerIndex: newAnswerIndex
    });
  });

  return { questions: processedQuestions };
}

function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(updateInfoBar, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
    }
}

function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function updateInfoBar() {
    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    
    document.getElementById("quizTimer").textContent = formatTime(elapsedSeconds);
    document.getElementById("currentScore").textContent = score;
    document.getElementById("maxScore").textContent = maxScore;
    document.getElementById("totalQuestions").textContent = quizData.questions.length;
    document.getElementById("currentProgress").textContent = currentQuestion;

    const progressPercentage = (currentQuestion / quizData.questions.length) * 100;
    document.getElementById("progressBar").style.width = `${progressPercentage}%`;
}


function startQuiz() {
  const input = document.getElementById("quizInput").value.trim();
  try {
    const parsedData = JSON.parse(input);
    if (!parsedData.questions) throw new Error("Invalid structure");
    
    // Process and validate data, including shuffling
    quizData = processQuizData(parsedData);

    if (quizData.questions.length === 0) {
        alert("The quiz is empty after validation. Check your JSON format and answer indices.");
        return;
    }

    // Initialize state
    score = 0;
    currentQuestion = 0;
    maxScore = quizData.questions.length * 2;
    
    // Start display and timer
    document.getElementById("quizInput").style.display = "none";
    document.querySelector(".quiz-box > button").style.display = "none";
    document.getElementById("quizArea").style.display = "block";
    
    startTimer();
    updateInfoBar();
    showQuestion();
    
  } catch (e) {
    alert("Invalid JSON format. Please check your input.");
    console.error("Quiz Start Error:", e);
  }
}

function showQuestion() {
  const q = quizData.questions[currentQuestion];
  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");
  const visualEl = document.getElementById("visualContent");
  
  // 1. Update Info Bar for current question
  updateInfoBar();

  // 2. Clear previous state
  optionsEl.innerHTML = "";
  visualEl.innerHTML = "";
  visualEl.style.display = "none";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";

  // 3. Set Question Text (Handle SVG/Rich content)
  let questionText = q.question;
  const svgMatch = questionText.match(/<svg[^>]*>[\s\S]*?<\/svg>/i);
  
  if (svgMatch) {
      visualEl.innerHTML = svgMatch[0];
      visualEl.style.display = "block";
      questionText = questionText.replace(svgMatch[0], '').trim();
  }
  
  questionEl.innerHTML = `Q${currentQuestion + 1}: ${questionText}`;

  // 4. Set Options
  q.options.forEach((opt, i) => {
    const li = document.createElement("li");
    li.innerHTML = opt; 
    li.onclick = () => checkAnswer(i, li);
    optionsEl.appendChild(li);
    
    if (opt.includes('<svg')) {
        li.style.minHeight = '60px'; 
    }
  });
}

function checkAnswer(selected, el) {
  const q = quizData.questions[currentQuestion];
  const options = document.querySelectorAll("#options li");
  const feedbackEl = document.getElementById("feedback");

  // Disable further clicks
  options.forEach(o => o.style.pointerEvents = "none");
  el.setAttribute('data-checked', 'true');

  if (selected === q.answerIndex) {
    el.classList.add("correct");
    feedbackEl.innerHTML = "<span style='color: var(--success-color);'>&#10003; Correct! (+2 Points)</span>";
    score += 2;
  } else {
    el.classList.add("wrong");
    const correctEl = options[q.answerIndex];
    correctEl.classList.add("correct");
    
    feedbackEl.innerHTML = `<span style='color: var(--error-color);'>&#10007; Wrong! (-1 Point)</span><br>The correct option was: <span style='color: var(--success-color);'>${correctEl.textContent.trim()}</span>`;
    score -= 1;
  }
  
  updateInfoBar(); // Update score live
  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion < quizData.questions.length) {
    showQuestion();
  } else {
    stopTimer();
    const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
    const finalTime = formatTime(elapsedSeconds);
    
    document.getElementById("quizArea").innerHTML = 
      `<h2>Assessment Complete!</h2>
      <p>You completed ${quizData.questions.length} questions in <strong>${finalTime}</strong>.</p>
      <p>Your Final Score: <strong style="font-size: 1.5em; color: ${score >= maxScore * 0.6 ? 'var(--success-color)' : 'var(--error-color)'};">${score}</strong> / ${maxScore}</p>
      <button onclick="window.location.reload()">Restart Quiz</button>`;
  }
}
</script>
</body>
</html>
